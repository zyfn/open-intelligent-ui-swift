name: Temporary typography diagnosis

on:
  push:
    branches: ['diagnostics/typography-20261123']

permissions:
  contents: read

jobs:
  ios-typography:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      OPENUI_RUNTIME_TELEMETRY_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run real iOS typography assertions and metric probes
        run: |
          python3 - <<'PY'
          import json, os, pathlib, runpy, subprocess
          out = pathlib.Path('outputs/typography-diagnostics').resolve()
          out.mkdir(parents=True)
          os.environ['OPENUI_SNAPSHOT_DIR'] = str(out / 'visual')
          os.environ['TEST_RUNNER_OPENUI_SNAPSHOT_DIR'] = str(out / 'visual')
          os.environ['TEST_RUNNER_OPENUI_RUNTIME_TELEMETRY_ENABLED'] = '0'
          ios = runpy.run_path('Validation/SDK/ios.py')
          inventory = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))
          device = ios['choose_device'](inventory, None)
          (out / 'device.json').write_text(json.dumps(device, indent=2) + '\n')
          if device['state'] != 'Booted':
              subprocess.run(['xcrun', 'simctl', 'boot', device['udid']], check=True)
          subprocess.run(['xcrun', 'simctl', 'bootstatus', device['udid'], '-b'], check=True, timeout=300)
          argv = ['xcodebuild', 'test', '-scheme', ios['SCHEME'], '-destination', f"platform=iOS Simulator,id={device['udid']}",
                  '-destination-timeout', '120', '-derivedDataPath', str(pathlib.Path(os.environ['RUNNER_TEMP']) / 'typography-build'),
                  '-resultBundlePath', str(out / 'typography.xcresult'), '-parallel-testing-enabled', 'NO',
                  '-only-testing:SwiftOpenUITests/SemanticTypographyTests',
                  '-only-testing:SwiftIntelligentUITests/SemanticTypographyTests',
                  '-only-testing:SwiftIntelligentUITests/TypographyDiagnosticsTests', 'CODE_SIGNING_ALLOWED=NO']
          (out / 'command.json').write_text(json.dumps(argv, indent=2) + '\n')
          with (out / 'tests.log').open('wb') as log:
              result = subprocess.run(argv, stdout=log, stderr=subprocess.STDOUT, timeout=1800)
          for kind in ('summary', 'tests'):
              with (out / (kind + '.json')).open('wb') as log:
                  subprocess.run(['xcrun', 'xcresulttool', 'get', 'test-results', kind, '--path', str(out / 'typography.xcresult')], stdout=log, check=True)
          print((out / 'tests.log').read_text(errors='replace')[-12000:])
          summary = json.loads((out / 'summary.json').read_text())
          expected = {f'table-font-{slot}-{state}.png' for slot in ('header', 'body') for state in ('large', 'accessibility2', 'updated-theme', 'restored')}
          observed = {p.name for p in (out / 'visual/semantic-typography').glob('*.png')}
          evidence = {'expectedTests': 16, 'actualTests': summary.get('totalTestCount'), 'expectedImages': sorted(expected), 'observedImages': sorted(observed)}
          (out / 'evidence.json').write_text(json.dumps(evidence, indent=2) + '\n')
          print(json.dumps(evidence))
          if result.returncode: raise SystemExit(result.returncode)
          if summary.get('totalTestCount') != 16 or expected != observed: raise SystemExit('Incomplete diagnostic test or image evidence')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typography-diagnostics-${{ github.run_id }}
          path: outputs/typography-diagnostics/
          if-no-files-found: error
          retention-days: 7

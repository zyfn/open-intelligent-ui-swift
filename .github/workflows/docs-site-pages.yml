name: Swift SDK documentation site

on:
  pull_request:
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs-site-pages.yml'
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs-site-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix docs-site --ignore-scripts
      - name: Export native SDK component contracts
        run: swift run --package-path docs-site/tools GuideExport "$GITHUB_WORKSPACE/docs-site/public/current"
      - name: Build interactive documentation
        run: npm run build --prefix docs-site
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs-site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4

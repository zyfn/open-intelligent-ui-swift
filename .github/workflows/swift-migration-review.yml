name: Swift migration input review
on:
  push:
    branches: [codex/swift-sdk-consolidation-rc21]
    paths: ['.github/workflows/swift-migration-review.yml']
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exact review inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/swift-migration-review"
          git rev-parse HEAD > "$RUNNER_TEMP/swift-migration-review/checkout-sha.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/swift-migration-review/git-tree.txt"
          git archive --format=tar HEAD > "$RUNNER_TEMP/swift-migration-review/target-source.tar"
          git clone --filter=blob:none --no-checkout https://github.com/thesysdev/openui.git "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" archive --format=tar f08a660535e55b5b2a24a0eb68568edaf9e4fe4b LICENSE packages/lang-core > "$RUNNER_TEMP/swift-migration-review/official-core-source.tar"
          git -C "$RUNNER_TEMP/upstream" rev-parse f08a660535e55b5b2a24a0eb68568edaf9e4fe4b:packages/lang-core > "$RUNNER_TEMP/swift-migration-review/official-core-tree.txt"
          npm view @openuidev/lang-core@1.0.2 --json > "$RUNNER_TEMP/swift-migration-review/official-npm-metadata.json"
          cd "$RUNNER_TEMP/swift-migration-review"
          npm pack @openuidev/lang-core@1.0.2 --ignore-scripts
          sha256sum *.tar *.tgz > archive-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swift-migration-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/swift-migration-review/
          retention-days: 7

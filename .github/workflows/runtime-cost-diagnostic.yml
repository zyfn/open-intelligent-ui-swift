name: Runtime trace export diagnostic

on:
  push:
    branches: [diagnostics/runtime-cost-capture]

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: runtime-cost-profile-44241757025
          run-id: 44241757025
          github-token: ${{ github.token }}
          path: capture
      - name: Export the CPU table observed in the captured TOC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p exported
          cp capture/provenance.log capture/xctrace-toc.xml exported/
          xcrun xctrace export --input capture/candidate.trace --xpath '/trace-toc/run[@number="1"]/data/table[@schema="time-profile"]' --output exported/time-profile.xml > exported/export.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-cpu-export-${{ github.run_id }}
          path: exported/
          if-no-files-found: error
          retention-days: 7

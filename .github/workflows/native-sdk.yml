name: OpenUI mounted component diagnostic
on:
  push:
    branches: [codex/openui-component-failure-diagnostic]
permissions:
  contents: read
jobs:
  component-probe:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      OPENUI_RUNTIME_TELEMETRY_ENABLED: '0'
      OPENUI_SNAPSHOT_DIR: ${{ github.workspace }}/outputs/component-probe
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve probe inputs and toolchain
        run: |
          mkdir -p outputs/component-probe
          { git rev-parse HEAD; swift --version; xcodebuild -version; } > outputs/component-probe/provenance.log
          cp Tests/SwiftOpenUITests/ButtonLayoutContractTests.swift Tests/SwiftOpenUITests/ChartInspectionTests.swift Tests/SwiftOpenUITests/NativeComponentsTests.swift outputs/component-probe/
      - name: Observe unchanged failing assertions
        run: |
          set -o pipefail
          swift test --filter 'testChangingSingleActionIntentDoesNotRemountItsButton|testMountedPieRetainsCompletedValuesUntilReplacementDataCloses|testFormSubmissionUsesExistingEventsAndExactFieldKeys' 2>&1 | tee outputs/component-probe/tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openui-component-diagnostic-${{ github.run_id }}
          path: outputs/component-probe/
          retention-days: 7

name: Native SDK and lang compatibility

on:
  push:
    branches: [main, 'codex/**', 'refactor/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-sdk-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  reproducible-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENUI_RUNTIME_TELEMETRY_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce resources and validate source contracts
        run: python3 Validation/SDK/run.py --profile portable --output outputs/verification/sdk-validation/portable
      - name: Publish executed checks
        if: always()
        run: cat outputs/verification/sdk-validation/portable/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-validation-portable-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/verification/sdk-validation/portable/
          if-no-files-found: error
          retention-days: 7

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit all five pinned dependency graphs
        run: python3 Validation/SDK/run.py --profile security --output outputs/verification/sdk-validation/security
      - name: Publish executed checks
        if: always()
        run: cat outputs/verification/sdk-validation/security/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-validation-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/verification/sdk-validation/security/
          if-no-files-found: error
          retention-days: 7

  native-sdk:
    needs: reproducible-inputs
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      OPENUI_RUNTIME_TELEMETRY_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run macOS SDK, Gallery, consumers and performance validation
        run: python3 Validation/SDK/run.py --profile macos --output outputs/verification/sdk-validation/macos
      - name: Publish executed checks
        if: always()
        run: cat outputs/verification/sdk-validation/macos/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-validation-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/verification/sdk-validation/macos/
          if-no-files-found: error
          retention-days: 7

  ios-sdk:
    needs: reproducible-inputs
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      OPENUI_RUNTIME_TELEMETRY_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute SDK and Gallery App tests on iPhone Simulator and verify iOS builds
        run: python3 Validation/SDK/run.py --profile ios --output outputs/verification/sdk-validation/ios
      - name: Publish executed checks
        if: always()
        run: cat outputs/verification/sdk-validation/ios/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-validation-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/verification/sdk-validation/ios/
          if-no-files-found: error
          retention-days: 7

  native-acceptance:
    name: Native SDK acceptance
    needs: [reproducible-inputs, dependency-security, native-sdk, ios-sdk]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-validation-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/verification/sdk-validation-inputs
      - name: Verify complete reports and their evidence for the exact commit
        if: always()
        env:
          VERIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 Validation/SDK/run.py collect
          --input outputs/verification/sdk-validation-inputs
          --expected-sha "$VERIFIED_SHA"
          --output outputs/verification/sdk-validation-acceptance
      - name: Require every prerequisite job to succeed
        if: always()
        env:
          INPUTS_RESULT: ${{ needs.reproducible-inputs.result }}
          SECURITY_RESULT: ${{ needs.dependency-security.result }}
          MACOS_RESULT: ${{ needs.native-sdk.result }}
          IOS_RESULT: ${{ needs.ios-sdk.result }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          results = {name: os.environ[name] for name in (
              'INPUTS_RESULT', 'SECURITY_RESULT', 'MACOS_RESULT', 'IOS_RESULT')}
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as stream:
              stream.write('## Required jobs\n\n| Job | Result |\n| --- | --- |\n')
              for name, result in results.items():
                  stream.write(f'| {name} | {result} |\n')
          if any(result != 'success' for result in results.values()):
              raise SystemExit('All four jobs must succeed; failed, cancelled, skipped or missing jobs do not pass')
          PY
      - name: Publish validation execution summary
        if: always()
        run: cat outputs/verification/sdk-validation-acceptance/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/verification/sdk-validation-acceptance/
          if-no-files-found: error
          retention-days: 7

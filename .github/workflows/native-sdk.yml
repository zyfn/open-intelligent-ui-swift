name: Native SDK and lang compatibility

on:
  push:
    branches: [main, 'codex/**', 'refactor/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-sdk-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  reproducible-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENUI_RUNTIME_TELEMETRY_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify SwiftPM module graph and imports
        run: |
          set -euo pipefail
          python3 Tools/check_module_boundaries.py
          if grep -R -nE '(^|[[:space:]])(@testable[[:space:]]+)?import[[:space:]]+(OpenUILang|OpenUI|OpenIntelligentUI|OpenUICore|OpenSwiftUI|OpenIntelligentSwiftUI|OpenUISwiftUI)([[:space:]]|$)' Sources Tests Examples Tools --include='*.swift'; then
            echo 'Obsolete Swift module imports remain'
            exit 1
          fi
      - name: Import ownership and localization
        run: |
          set -euo pipefail
          python3 Tools/check_openui_integration.py
          python3 Tools/check_gallery_catalog.py
          python3 Tools/check_localization.py
      - name: Rebuild the exact bundled official core
        run: |
          set -euo pipefail
          npm ci --prefix Tools/Core --ignore-scripts
          node Tools/Core/build.mjs
          git diff --exit-code -- Sources/SwiftLang/Resources
          node Tools/Core/verify-compatibility.mjs
          node --test Tools/Core/native-*.test.mjs
          node --test Validation/validation.test.mjs
          node --test Tools/Presentation/catalog-compatibility.test.mjs
      - name: Rebuild presentation resources from public registries
        run: |
          set -euo pipefail
          for feature in rich-text code-highlighting icons; do
            npm ci --prefix "Tools/Presentation/$feature" --ignore-scripts
          done
          node Tools/Presentation/rich-text/build.mjs
          node Tools/Presentation/code-highlighting/build.mjs
          node Tools/Presentation/icons/generate.mjs --check
          node Tools/Presentation/catalog.mjs --check
          git diff --exit-code -- Sources/SwiftOpenUI/Resources
      - name: Rebuild and verify Intelligent UI math resources
        run: |
          set -euo pipefail
          npm ci --prefix Tools/Functions --ignore-scripts
          node Tools/Functions/build-math.cjs
          node --test Tools/Functions/math-resources.test.cjs
          git diff --exit-code -- Sources/SwiftIntelligentUI/Resources
      - name: Retain input diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-input-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/native-input-evidence/checkout-sha.txt"
          git diff -- Sources > "$RUNNER_TEMP/native-input-evidence/generated-diff.patch"
          cp Sources/SwiftLang/Resources/core-manifest.json "$RUNNER_TEMP/native-input-evidence/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-input-evidence/
          retention-days: 7

  dependency-security:
    # Independent of functional tests: audit the real pinned build inputs.
    # Security fixes must regenerate the committed resources and pass contracts.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit every bundled generator dependency graph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-security"
          failed=0
          for feature in Tools/Core Tools/Presentation/rich-text \
              Tools/Presentation/code-highlighting Tools/Presentation/icons Tools/Functions; do
            label="${feature//\//-}"
            npm ci --prefix "$feature" --ignore-scripts \
              2>&1 | tee "$RUNNER_TEMP/native-security/$label-install.log"
            if npm audit --prefix "$feature" --audit-level=high --json \
                > "$RUNNER_TEMP/native-security/$label-audit.json"; then
              printf '0\n' > "$RUNNER_TEMP/native-security/$label-exit.txt"
            else
              status=$?
              printf '%s\n' "$status" > "$RUNNER_TEMP/native-security/$label-exit.txt"
              cat "$RUNNER_TEMP/native-security/$label-audit.json"
              failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-security/
          retention-days: 7

  native-sdk:
    needs: reproducible-inputs
    # Preserve the existing design branch's supported toolchain.
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      OPENUI_SNAPSHOT_DIR: ${{ github.workspace }}/outputs/verification/visual
      OPENUI_RUNTIME_TELEMETRY_ENABLED: '0'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record toolchain and exact checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/verification
          { git rev-parse HEAD; swift --version; xcodebuild -version; sw_vers; } \
            2>&1 | tee outputs/verification/provenance.log
      - name: Native lifecycle, deep-data and state regressions
        shell: bash
        run: |
          set -euo pipefail
          swift test --filter 'QueryDispatchBoundaryTests|NativeValueBudgetTests|MutationRetirementTests|NativeProjectionInputBudgetTests|ResourceCacheBudgetTests|ResourceStoreTests|SharedCoreBridgeTests' \
            2>&1 | tee outputs/verification/native-deep-data.log
      - name: Retain deep-data diagnostics immediately
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-deep-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/verification/native-deep-data.log
          if-no-files-found: warn
          retention-days: 7
      - name: Focused native Debug closure regressions
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          swift test --filter 'testInterruptedSVGWithAnUnclosedSourceReplacesLoadingWithReadableFallback|testMountedStoreReadersLeaveUnrelatedSiblingBuildersAndBodiesAlone|testSharedByteCountLimitAlsoBoundsEmptyResponses|testRefetchDuringFlightQueuesAndRefreshTimerStops|SemanticTypographyTests' \
            2>&1 | tee outputs/verification/native-closure-debug.log
      - name: Retain focused Debug closure diagnostics immediately
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-closure-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/verification/native-closure-debug.log
          if-no-files-found: warn
          retention-days: 7
      - name: Focused native Release closure regressions
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          swift test --configuration release --filter 'testInterruptedSVGWithAnUnclosedSourceReplacesLoadingWithReadableFallback|testMountedStoreReadersLeaveUnrelatedSiblingBuildersAndBodiesAlone|testSharedByteCountLimitAlsoBoundsEmptyResponses|testRefetchDuringFlightQueuesAndRefreshTimerStops|SemanticTypographyTests' \
            2>&1 | tee outputs/verification/native-closure-release.log
      - name: Retain focused Release closure diagnostics immediately
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-closure-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/verification/native-closure-release.log
          if-no-files-found: warn
          retention-days: 7
      - name: OpenUI media and text regressions
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for configuration in debug release; do
            if swift test --configuration "$configuration" --filter 'NativeImageSizingTests|NativeMediaRetryTests|NativeMediaResourceTests|SignedMediaResourceTests|ResourceStoreTests|StreamingTextPresentationTests|MountedStreamingTextProgressTests|StreamingMediaRetentionTests|AdaptivePresentationTests|PhotoCardGeometryTests|ReadingControlPresentationTests|ObjectCardCompositionTests|StreamingLayoutContractTests|LayoutMeasurementReductionTests|ButtonLayoutContractTests|ChartInspectionTests|NativeComponentsTests|BoundaryIdentityTests|NativeComponentSubscriptionTests|StreamingRenderIsolationTests|TableAppearanceTests|ReadingRhythmTests|StreamingVisualStateTests|TableMountedViewTests|ComponentLibraryTests|ComponentReadinessTests|FullLibraryParityTests|NativeActionRenderingTests|LibraryFacadeTests|InputTests|AncestorInteractionScopeTests|SliderFeedbackRenderingTests|StreamingFormCorrectnessTests' \
                2>&1 | tee "outputs/verification/openui-media-text-$configuration.log"; then
              :
            else
              failed=1
            fi
          done
          for attempt in 1 2 3; do
            if swift test --skip-build --configuration debug --filter 'testMountedImageCanSwitchFromExplicitPixelsToMeasuredPixels|testMountedCardWaitsForResolvedWidthThenUpgradesOnlyWhenNeeded' \
                2>&1 | tee "outputs/verification/openui-media-text-size-transitions-$attempt.log"; then
              :
            else
              failed=1
            fi
          done
          exit "$failed"
      - name: Retain OpenUI regression diagnostics immediately
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-openui-media-text-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/verification/openui-media-text-*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Release native fitting
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          swift test -c release --filter 'HostSizingIsolationTests|RuntimeHostIsolationTests' \
            2>&1 | tee outputs/verification/release-fitting.log
      - name: All library products for iOS 16 Simulator
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          for target in SwiftOpenUI SwiftIntelligentUI; do
            swift build --target "$target" --scratch-path "$RUNNER_TEMP/native-ios" \
              --triple arm64-apple-ios16.0-simulator --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
              2>&1 | tee "outputs/verification/$target-ios.log"
          done
      - name: iOS Gallery using the same local package
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project Examples/Gallery/OpenUIGallery.xcodeproj \
            -scheme OpenUIGallery -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/OpenUIGallery-build" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee outputs/verification/gallery-ios.log
      - name: All native package tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          swift test 2>&1 | tee outputs/verification/sdk-tests.log
      - name: Retain native test diagnostics immediately
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-package-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/verification/sdk-tests.log
          if-no-files-found: warn
          retention-days: 7
      - name: Independent swift-lang, swift-ui and swift-intelligent-ui consumers
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/check_product_consumers.py --scratch-root "$RUNNER_TEMP/native-consumers" \
            2>&1 | tee outputs/verification/product-consumers.log
      - name: Release streaming, failure and resource boundaries
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          swift test -c release --filter 'StreamingRenderIsolationTests|MountedStreamingTextProgressTests|ComponentRenderInputTests|NativeComponentSubscriptionTests|NativePresentationCommitTests|NativeLiveElementUpdateTests|QueryDispatchBoundaryTests|NativeValueBudgetTests|MutationRetirementTests|NativeProjectionInputBudgetTests|ActionWorkBudgetTests|RuntimeReentrancyTests|MCPInputBudgetTests|StoreAggregateBudgetTests|NativeContextBudgetTests|RuntimeLimitsTests|ResourceStoreTests|ResourceCacheBudgetTests|SharedCoreBridgeTests|FramedStreamingTests|ProjectionBridgeTests|SourceSnapshotBridgeTests|EvaluationDefinitionsTests|StreamingPublicationTests|LiveElementIndexTests|BoundaryIdentityTests|NativeActionRenderingTests|FieldSelectionRenderingTests|TableMountedViewTests|NativeImageSizingTests|NativeMediaRetryTests|NativeMediaResourceTests|SignedMediaResourceTests|StreamingTextPresentationTests' \
            2>&1 | tee outputs/verification/release-streaming.log
      - name: Standalone Gallery tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Examples/Gallery --scratch-path "$RUNNER_TEMP/gallery-swiftpm" \
            2>&1 | tee outputs/verification/gallery-tests.log
      - name: Gallery fixture programs
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          swift run --package-path Examples/Gallery --scratch-path "$RUNNER_TEMP/gallery-swiftpm" OpenUIGallery --validate-fixtures \
            2>&1 | tee outputs/verification/gallery-fixtures.log
          swift run --package-path Examples/Gallery --scratch-path "$RUNNER_TEMP/gallery-swiftpm" --skip-build OpenUIGallery \
            --export-contracts "$PWD/outputs/verification/gallery-contracts" \
            2>&1 | tee outputs/verification/gallery-contracts.log
      - name: Preserve historical Intelligent UI contracts
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/check_lang_compatibility.py \
            2>&1 | tee outputs/verification/historical-contracts.log
      - name: Native language AddressSanitizer
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          swift test --scratch-path "$RUNNER_TEMP/openui-asan" --sanitize=address --filter SwiftLangTests \
            2>&1 | tee outputs/verification/asan.log
      - name: Independent contract and performance tools
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          swift build --package-path Tools/ContractExport \
            2>&1 | tee outputs/verification/contract-tool.log
          swift build --configuration release --package-path Benchmarks/LanguageRuntime \
            2>&1 | tee outputs/verification/benchmark-build.log
      - name: Release language and changing-tail streaming measurements
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          for chunk in 24 128; do
            swift run --configuration release --package-path Benchmarks/LanguageRuntime --skip-build \
              LanguageBenchmark --iterations 100 --warmup 5 --rows 200 \
              --stream-iterations 5 --chunk-units "$chunk" \
              --output "outputs/verification/language-stream-$chunk.json" \
              2>&1 | tee "outputs/verification/language-stream-$chunk.log"
          done
      - name: Retain native crash reports
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, shutil
          start = pathlib.Path('outputs/verification/provenance.log')
          reports = pathlib.Path.home() / 'Library/Logs/DiagnosticReports'
          destination = pathlib.Path('outputs/verification/crash-reports')
          if start.exists() and reports.is_dir():
              for report in reports.iterdir():
                  if ('PackageTests' in report.name or report.name.startswith('xctest')) \
                      and report.suffix in {'.ips', '.crash'} and report.stat().st_mtime >= start.stat().st_mtime:
                      destination.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(report, destination / report.name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/verification/
          if-no-files-found: warn
          retention-days: 7

  native-acceptance:
    name: Native SDK acceptance
    # A skipped native job must not count as an accepted SDK revision.
    needs: [reproducible-inputs, dependency-security, native-sdk]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every prerequisite to succeed
        shell: bash
        env:
          VERIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          INPUTS_RESULT: ${{ needs.reproducible-inputs.result }}
          SECURITY_RESULT: ${{ needs.dependency-security.result }}
          NATIVE_RESULT: ${{ needs.native-sdk.result }}
        run: |
          set -euo pipefail
          {
            printf '## Native SDK acceptance\n\n'
            printf 'Commit: `%s`\n\n' "$VERIFIED_SHA"
            printf '| Required job | Result |\n| --- | --- |\n'
            printf '| reproducible-inputs | %s |\n' "$INPUTS_RESULT"
            printf '| dependency-security | %s |\n' "$SECURITY_RESULT"
            printf '| native-sdk | %s |\n' "$NATIVE_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$INPUTS_RESULT" != success || "$SECURITY_RESULT" != success || "$NATIVE_RESULT" != success ]]; then
            printf '::error::Native SDK acceptance requires all three jobs to succeed; failed, cancelled, skipped or missing results do not pass.\n'
            exit 1
          fi

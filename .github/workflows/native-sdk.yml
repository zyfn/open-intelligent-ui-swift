name: Native SDK and lang compatibility

on:
  push:
    branches: [codex/intelligentui-design-revamp]
  pull_request:
    branches: [codex/sdk-baseline]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-sdk-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native-sdk:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Localization resources
        run: python3 Tools/check_localization.py
      - name: Swift package tests
        run: swift test
      - name: Gallery fixture programs
        run: swift run IntelligentUIGallery --validate-fixtures
      - name: Historical lang compatibility
        run: python3 Tools/check_lang_compatibility.py
      - name: iOS Simulator build
        run: |
          xcodebuild -project Examples/Gallery/IntelligentUIGallery.xcodeproj \
            -scheme IntelligentUIGallery \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/IntelligentUIGallery-build" \
            CODE_SIGNING_ALLOWED=NO build


name: Signed media fixture pixel probe

on:
  push:
    branches: [codex/openui-signed-fixture-diagnostic]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-pixels:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compile and inspect original fixture pixels
        shell: bash
        run: |
          set -euo pipefail
          probe_dir="Tools/Diagnostics/fixture-probe"
          result_dir="outputs/verification/openui-media-responsiveness/fixture-probe/results"
          mkdir -p "$result_dir"
          git rev-parse HEAD > "$result_dir/checkout-sha.txt"
          xcodebuild -version > "$result_dir/toolchain.txt"
          xcrun swiftc --version >> "$result_dir/toolchain.txt"
          shasum -a 256 "$probe_dir/legacy-helper.swift.txt" "$probe_dir/reference-helper.swift.txt" > "$result_dir/helper-sha256.txt"
          xcrun swiftc -parse-as-library "$probe_dir/SignedMediaFixtureProbe.swift" -o "$probe_dir/SignedMediaFixtureProbe" 2>&1 | tee "$result_dir/compile.log"
          "$probe_dir/SignedMediaFixtureProbe" "$result_dir" "$probe_dir/source-manifest.json" 2>&1 | tee "$result_dir/run.log"
          shasum -a 256 "$result_dir"/*.png > "$result_dir/png-sha256.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-media-fixture-pixels-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            outputs/verification/openui-media-responsiveness/fixture-probe/results/
            Tools/Diagnostics/fixture-probe/source-manifest.json
            Tools/Diagnostics/fixture-probe/legacy-helper.swift.txt
            Tools/Diagnostics/fixture-probe/reference-helper.swift.txt
            Tools/Diagnostics/fixture-probe/SignedMediaFixtureProbe.swift
          retention-days: 7
